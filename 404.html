<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Anil Kumawat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030d1c; color: #e2e8f0;
      font-family: Inter, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .wrap { max-width: 500px; }
    .emoji { font-size: 5rem; margin-bottom: 1rem; }
    h1 { font-size: 2.5rem; font-weight: 900; margin-bottom: 1rem;
      background: linear-gradient(135deg,#60a5fa,#f97316);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    p { color: #94a3b8; margin-bottom: 2rem; line-height: 1.6; }
    a {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: #f97316; color: #fff; padding: 0.75rem 1.5rem;
      border-radius: 50px; text-decoration: none; font-weight: 700;
      transition: transform 0.2s;
    }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="emoji">☁️</div>
    <h1>404 — Lost in the Cloud</h1>
    <p>This page drifted off into the ether. The good news? The rest of my portfolio is right here.</p>
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
